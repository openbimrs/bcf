[package]
name = "openbim-bcf"
version = "0.2.0"
edition = "2021"
rust-version = "1.85"
license = "MIT"
authors = ["OpenBIM.rs contributors"]
repository = "https://github.com/openbimrs/bcf"
readme = "../README.md"
description = "Tolerant pure-Rust reader for BCF-XML (BIM Collaboration Format) issue archives."
keywords = ["bim", "openbim", "bcf", "ifc", "aec"]
categories = ["parser-implementations", "data-structures"]

[dependencies]
openbim-core = "0.1"
quick-xml = "0.37"
# `deflate` only: BCF archives in the corpus are stored or deflated, and the
# other codecs would pull in C toolchains this workspace does not accept.
zip = { version = "2.4", default-features = false, features = ["deflate"] }

[lints.rust]
missing_docs = "warn"
unsafe_code = "forbid"

[lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"

[dev-dependencies]
zip = { version = "2.4", default-features = false, features = ["deflate"] }
