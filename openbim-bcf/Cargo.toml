[package]
name = "openbim-bcf"
version = "0.6.0"
edition = "2021"
rust-version = "1.88"
license = "AGPL-3.0-or-later"
authors = ["OpenBIM.rs contributors"]
repository = "https://github.com/openbimrs/bcf"
readme = "../README.md"
description = "Tolerant pure-Rust reader and strict, deterministic writer for BCF-XML (BIM Collaboration Format) issue archives."
keywords = ["bim", "openbim", "bcf", "ifc", "aec"]
categories = ["parser-implementations", "encoding", "data-structures"]

[dependencies]
openbim-core = "0.1"
quick-xml = "0.42"
# Deflate through flate2 + zlib-rs only: BCF archives in the corpus are stored
# or deflated, the other codecs would pull in C toolchains this workspace does
# not accept, and zip's `deflate` umbrella would add the Zopfli encoder, which
# the writer never uses (levels 1..=9 are flate2's). zlib-rs is Zlib-licensed.
zip = { version = "8", default-features = false, features = ["deflate-flate2-zlib-rs"] }

[lints.rust]
missing_docs = "warn"
unsafe_code = "forbid"

[lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"

[dev-dependencies]
zip = { version = "8", default-features = false, features = ["deflate-flate2-zlib-rs"] }
