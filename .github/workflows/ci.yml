name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  rust:
    name: Rust gate
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Install Rust 1.88
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: 1.88.0
          components: rustfmt, clippy
      - name: Install lxml for XSD validation of written archives
        run: sudo apt-get update && sudo apt-get install -y python3-lxml
      - name: Fetch official BCF references
        # CC BY-ND, so fetched rather than vendored. Non-fatal: the corpus
        # tests skip cleanly when absent, and an upstream outage must not be
        # indistinguishable from a code defect.
        continue-on-error: true
        run: ./scripts/fetch-official-references.py
      - name: Run verified gate
        run: ./scripts/gate.sh
      - name: Run mutation probes
        run: ./scripts/mutation-probes.py
