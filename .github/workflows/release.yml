# Publish openbim-bcf to crates.io when a release tag `v<version>` is pushed.
#
# crates.io trusted publishing (OIDC): there is no token secret. crates.io
# trusts exactly this repository, this file name (`release.yml`) and the
# `release` environment -- renaming either breaks publishing until the
# crate's Settings -> Trusted Publishing entry on crates.io follows. The
# temporary token lives for 30 minutes and is revoked when the job ends.
#
# Releasing: bump `version` in openbim-bcf/Cargo.toml, date the
# docs/CHANGELOG.md section, commit on main, then push an annotated tag
# `v<version>` on that commit. Run it by hand (Actions -> Release -> Run
# workflow) with a tag name to rehearse a release: the tagged commit is gated
# and packaged, nothing is published.
name: Release

on:
  push:
    tags:
      - "v[0-9]*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to rehearse, e.g. v0.3.0 (gate and package only)"
        required: true

# Never cancel a release halfway.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  TAG: ${{ github.event_name == 'push' && github.ref_name || inputs.tag }}

jobs:
  gate:
    name: Plan and gate
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.plan.outputs.version }}
    steps:
      - name: Check out the tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.TAG }}
          fetch-depth: 0
      - name: Require the tag to be on main
        # A tag on an unmerged branch would publish code main never gated.
        run: |
          git fetch --quiet origin main
          git merge-base --is-ancestor HEAD origin/main \
            || { echo "::error::$TAG is not on main"; exit 1; }
      - name: Install Rust 1.85
        # The same pin as ci.yml, so the release gate is the CI gate.
        uses: dtolnay/rust-toolchain@bc540ba06a4ccee415bb241490e0b25ee8e7d315 # 1.85.0
        with:
          components: rustfmt, clippy
      - name: Require the tag to name the crate's version
        id: plan
        run: |
          version="$(cargo metadata --format-version 1 --no-deps \
            | python3 -c 'import json,sys; print(next(p["version"] for p in json.load(sys.stdin)["packages"] if p["name"]=="openbim-bcf"))')"
          [ "$TAG" = "v$version" ] \
            || { echo "::error::tag $TAG does not match Cargo.toml version $version"; exit 1; }
          grep -q "^## \[$version\]" docs/CHANGELOG.md \
            || { echo "::error::docs/CHANGELOG.md has no [$version] section"; exit 1; }
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Install lxml for XSD validation of written archives
        run: sudo apt-get update && sudo apt-get install -y python3-lxml
      - name: Fetch official BCF references
        # Unlike CI, fatal: a release must carry the corpus and XSD evidence
        # its documentation claims, so an upstream outage blocks it.
        run: ./scripts/fetch-official-references.py
      - name: Run the gate on the tagged commit
        # The same gate as CI: fmt, build, tests (with the official corpus),
        # clippy, docs, XSD validation of the writer, and `cargo package`.
        run: ./scripts/gate.sh
      - name: Run mutation probes
        run: ./scripts/mutation-probes.py

  publish:
    name: Publish to crates.io
    needs: gate
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    environment: release
    permissions:
      contents: read
      id-token: write # crates.io trusted publishing (OIDC)
    steps:
      - name: Check out the tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.TAG }}
      - name: Install Rust 1.85
        uses: dtolnay/rust-toolchain@bc540ba06a4ccee415bb241490e0b25ee8e7d315 # 1.85.0
      - name: Check whether this version is already live
        # Re-running a partly failed release finishes it instead of failing
        # on what already succeeded.
        id: live
        env:
          VERSION: ${{ needs.gate.outputs.version }}
        run: |
          status="$(curl -s -o /dev/null -w '%{http_code}' \
            -A 'openbimrs/bcf release workflow (github.com/openbimrs/bcf)' \
            "https://crates.io/api/v1/crates/openbim-bcf/$VERSION")"
          echo "live=$([ "$status" = 200 ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
      - name: Authenticate with crates.io
        if: steps.live.outputs.live != 'true'
        id: auth
        uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1.0.5
      - name: Publish
        if: steps.live.outputs.live != 'true'
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        run: cargo publish -p openbim-bcf --locked

  github-release:
    name: GitHub release
    needs: [gate, publish]
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    permissions:
      contents: write # create the release
    steps:
      - name: Check out the tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.TAG }}
      - name: Create the release from the changelog section
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.gate.outputs.version }}
        run: |
          python3 - > notes.md <<'EOF'
          import os
          text = open("docs/CHANGELOG.md", encoding="utf-8").read()
          start = text.index(f"## [{os.environ['VERSION']}]")
          end = text.index("\n## [", start + 1)
          print(text[start:end].split("\n", 1)[1].strip())
          print(f"\n**crates.io:** https://crates.io/crates/openbim-bcf/{os.environ['VERSION']}")
          EOF
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "release $TAG already exists"
          else
            gh release create "$TAG" --title "openbim-bcf $VERSION" --notes-file notes.md --verify-tag
          fi
